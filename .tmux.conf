#
# ~/.tmux.conf
#

%hidden tmp_dir="$XDG_RUNTIME_DIR"
%if "#{==:$tmp_dir,}"
%hidden tmp_dir='/tmp'
%endif

# STATUS LINE
# Status line left side:  changes color with more than one session;
#  session name; number of clients session is attached to in subscript.
set  -g status-left '#[reverse] #{?#{e|>:#{server_sessions},1},#[bg=colour66],} '
set -ag status-left '#[default]#[reverse]#S'
set -ag status-left '#(printf "#{session_attached}" | sed 'y/0123456789/₀₁₂₃₄₅₆₇₈₉/')'
set -ag status-left '#(                                                      \
  SSH_AUTH_SOCK=$XDG_RUNTIME_DIR/ssh-agent.socket ssh-add -l >/dev/null 2>&1 \
    && printf "%%s" "󰌆"                                                      \
    || printf "%%s" "󱦃"                                                      \
)'
set -ag status-left ' #[default]'

# Status line right side: cwd, git branch/status and running vm
set -g status-right "#[fg=colour59]#{=/50/…:#{s|$HOME|~|:pane_current_path}}"
set -ag status-right "#[default] #(
  git --no-optional-locks -C '#{pane_current_path}' status --branch --porcelain=v2 \
    | awk '{                                                                       \
        if ($2 == \"branch.head\") { branch = \" \" $3; status = \" \" }           \
        if ($1 != \"#\") { status = \" \" }                                       \
      } END { print branch status }'                                               \
)"
set -ag status-right "#[reverse]#( \
virsh -c qemu:///system list --name \
  | sed '/^\s*$/d'                  \
  | tr '\n' ','                     \
  | sed 's/,//g'                   \
  | sed 's/$//'                    \
)"
set -ag status-right "#[reverse,bg=#{?client_prefix,colour211,colour238}]"

set-option -g status-left-length   40
set-option -g status-right-length  70
set-option -g status-style 'bg=terminal,bold,fg=colour0'
set-option -g status-left-style \
  'bg=terminal,bold,fg=#{?client_prefix,colour211,colour238}'

set-option -g status-keys vi
set-option -g status-interval 10
set-option -g window-status-current-format \
  "#[none]#[reverse]#(echo #I | sed 'y/0123456789/⁰¹²³⁴⁵⁶⁷⁸⁹/')\
#W#(echo #{window_panes} | sed 'y/0123456789/₀₁₂₃₄₅₆₇₈₉/')\
#{?window_flags,#(echo '#{window_flags}' | sed 'y/Z*/•/'), } #[none]"
set-option -g window-status-format \
  "#(echo #I | sed 'y/0123456789/⁰¹²³⁴⁵⁶⁷⁸⁹/')\
#W#(echo #{window_panes} | sed 'y/0123456789/₀₁₂₃₄₅₆₇₈₉/')\
#{?window_flags,#(echo '#{window_flags}' | sed 'y/Z-/←/'), }"

# Windows and panes
set-option -g display-panes-time   3000
set-option -g display-time         3000
set-option -g renumber-windows     on

# Set base index for windows and panes to 1
set-option -g base-index      1
set-option -g pane-base-index 1

# Display pane cmd as a terminal title
set-option -g set-titles on
set-option -g set-titles-string '#W'

# Borders
set-option -g display-panes-active-colour  yellow
set-option -g pane-border-style fg=black
set-option -g pane-active-border-style '#{?pane_in_mode,fg=yellow,fg=colour104}'
set-option -g popup-border-lines rounded
set-option -g popup-border-style fg=blue
set-option -g popup-style fg=terminal

# Layouts
set-option -g main-pane-height 75%
set-option -g main-pane-width  67%
# if there is more than 2 panes in the window or all panes have the same width
# select main-vertical layout (vertical separator) otherwise main-horizontal
bind v {
  if -F '#{||:#{e|>:#{window_panes},2},#{m:#{P:#{pane_width}},#{P/r:#{pane_width}}}}' \
    'select-layout main-vertical' \
    'select-layout main-horizontal'
}


# BINDINGS
# horizontal split, new pane is 83 columns wide
bind-key | split-window -fhc  '#{pane_current_path}' -l 83
bind-key '\' split-window -hc  '#{pane_current_path}' -l 83
# vertical split, new pane opens at current path
bind-key - split-window -vc  '#{pane_current_path}'
# vertical split, new pane is 25% of current height
bind-key _ split-window -vc  '#{pane_current_path}' -l 25%
bind-key e {
  resize-pane -t-1 -y 25%
  resize-pane -t+1 -y 25%
}
unbind '"'
unbind %
bind-key c new-window -c '#{pane_current_path}'

# Move marked pane after current
# bind-key J join-pane
# kill other panes
bind-key X confirm-before -p 'Kill all other panes? (y/n)' 'kill-pane -a'

# Activate/deactivate virtual environment
bind-key a send-keys Escape 'i' 'eval $(find_venv.sh)' C-m
# Source .tmux.conf
bind-key r source-file ~/.tmux.conf \; display-message "source-file done"

# hjkl - select pane Left/Down/Up/Right of current
bind-key    h select-pane -L
bind-key    j select-pane -D
bind-key    k select-pane -U
bind-key    l select-pane -R

# HJKL - resize pane Left/Down/Up/Right
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# Select last window
bind-key b select-window -l
# Select pane from the tree
bind t 'new-pane -x50% -y70% -X25% -Y15% -ED; choose-tree -hk'


# Copy Mode
set-option  -g mode-keys vi
bind-key    -T copy-mode-vi   v  send-keys -X begin-selection
bind-key    -T copy-mode-vi C-v  send-keys -X begin-selection \; send-keys -X rectangle-on
bind-key    -T copy-mode-vi   y  send-keys -X copy-selection

# Enable MOUSE support
set-option  -g mouse on

set-option  -s focus-events on
set-option  -g escape-time 100

# Clipboard
set-option  -g set-clipboard external
set-option  -g get-clipboard off

# Terminal
set-option -ga terminal-features ",*:RGB"
set-option  -g default-terminal tmux-256color

# Enable history file
set-option  -g history-file   ~/.tmux_history
set-option  -g history-limit  15000

# Change prefix key to Alt-/
set-option  -g   prefix M-/
unbind-key  C-b
bind-key    M-/  send-prefix

# tmux command lookup with fuzzy search
bind-key F1 {
  if-shell -F '#{N/s:man}' {} {
    display-popup -w 45 -h 14 -E            \
      "MANWIDTH=80 man tmux                 \
        | grep -Po '^\s{5}[a-z]+(-[a-z]+)+' \
        | fzf > $tmp_dir/selected"
  }
  display-popup -w 80 -h 24 -E    \
    "tmux new -As man 'man tmux'\\; send \"/^\$(cat $tmp_dir/selected)\" Enter"
}

# Open terminal in a popup
bind-key C-t popup -w 80 -h 24 -Ed '#{pane_current_path}' 'tmux new -As "term"'
bind-key   y new-pane -c '#{pane_current_path}' -x 80 -y 24 -X 35% -Y 30%

# Create/erase session cd history file
set-hook -g pane-focus-in {
  set-environment -Fg CD_HIST_TMP_FILE "$tmp_dir/cd_hist.#{pid}.#{session_id}"
  run-shell 'touch "$CD_HIST_TMP_FILE"'
  set-hook -g session-closed 'run-shell "rm -f \"$CD_HIST_TMP_FILE\""'
}

# Commands and messages
set-option -g message-command-style "bg=black,fg=terminal,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=black}"
set-option -g message-format "#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#{message}"
set-option -g message-line 0
set-option -g message-style "bg=colour23,fg=white,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=terminal}"
